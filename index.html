g=false;player.phase=0;player.lastCell='21,17';resetPartnerTrail(player.x+1,player.y);lastNearbyService=null;document.querySelector('.help').textContent='체육관은 위쪽 중앙, 1번 도로는 아래쪽, 동쪽 길은 숲길로 이어져.';syncServiceButton();say('태초마을로 돌아왔어!')}function exitNorthTown(){mapMode='route';H=40;worldKinds=routeKinds;player.x=12.5;player.y=1.8;player.dir='down';player.walking=false;player.phase=0;player.lastCell='12,1';resetPartnerTrail(12.5,1);spawnRouteWilds();lastNearbyService=null;document.querySelector('.help').textContent='풀숲에 보이는 야생 포켓몬과 부딪히면 배틀! 위쪽 길은 태초마을, 아래쪽 길은 팔레트 마을로 이어져.';syncServiceButton();say('야생 포켓몬이 나오는 도로로 돌아왔어!')}
let lastAutosave=0;function frame(now){const dt=Math.min((now-lastTime)/1000,.04)||0;lastTime=now;if(player.jump){const jump=player.jump;jump.elapsed=Math.min(jump.duration,jump.elapsed+dt);const progress=jump.elapsed/jump.duration;player.y=jump.fromY+(jump.toY-jump.fromY)*progress;if(progress>=1){player.y=jump.toY;player.jump=null;recordPlayerTrail()}}const d=(busy||player.jump)?null:getDir();player.walking=false;if(d){player.dir=d;const dx=d==='left'?-1:d==='right'?1:0,dy=d==='up'?-1:d==='down'?1:0,nx=player.x+dx*3.2*dt,ny=player.y+dy*3.2*dt;if(mapMode==='route'&&d==='up'&&nx>10.8&&nx<14.8&&ny<.55){enterNorthTown()}else if(mapMode==='route'&&d==='down'&&nx>10.8&&nx<14.8&&ny>H-1.3){enterTown()}else if(mapMode==='northTown'&&d==='right'&&nx>W-1.3&&Math.abs(ny-17.5)<1.25){enterEastRoute()}else if(mapMode==='eastRoute'&&d==='left'&&nx<1.15&&Math.abs(ny-9.5)<1.25){exitEastRoute()}else if(mapMode==='eastRoute'&&d==='right'&&nx>W-1.3&&Math.abs(ny-9.5)<1.25){enterExpansionMap('grayCity','west')}else if(extraLinks[mapMode]&&d==='left'&&nx<1.15&&Math.abs(ny-9.5)<1.25){enterExpansionMap(extraLinks[mapMode][0],'east')}else if(extraLinks[mapMode]?.[1]&&d==='right'&&nx>W-1.3&&Math.abs(ny-9.5)<1.25){enterExpansionMap(extraLinks[mapMode][1],'west')}else if(mapMode==='northTown'&&d==='down'&&nx>10.8&&nx<14.8&&ny>H-1.3){exitNorthTown()}else if(mapMode==='town'&&d==='up'&&nx>10.8&&nx<14.8&&ny<.45){enterRoute()}else if(mapMode==='town'&&d==='up'&&Math.abs(nx-6.5)<1.05&&ny<8.35){enterInterior('center')}else if(mapMode==='town'&&d==='up'&&Math.abs(nx-15.5)<1.05&&ny<8.35){enterInterior('mart')}else if(mapMode==='grayCity'&&d==='up'&&Math.abs(nx-12)<.85&&ny<6.4&&ny>5.5){enterInterior('gym')}else if(mapMode==='blueCity'&&d==='up'&&Math.abs(nx-6)<.85&&ny<6.4&&ny>5.5){enterInterior('gym')}else if(mapMode==='grayCity'&&d==='up'&&((Math.abs(nx-4)<.8&&ny<16.4&&ny>15.5)||(Math.abs(nx-17)<.8&&ny<16.4&&ny>15.5))){enterInterior(Math.abs(nx-4)<.8?'center':'mart')}else if(mapMode==='blueCity'&&d==='up'&&((Math.abs(nx-16)<.8&&ny<7.3&&ny>6.2)||(Math.abs(nx-10)<.8&&ny<16.3&&ny>15.2))){enterInterior(Math.abs(nx-16)<.8?'center':'mart')}else if(mapMode==='northTown'&&d==='up'&&Math.abs(nx-4)<1.1&&ny<12.3){enterInterior('center')}else if(mapMode==='northTown'&&d==='up'&&Math.abs(nx-18)<1.1&&ny<12.3){enterInterior('mart')}else if(mapMode==='northTown'&&d==='up'&&Math.abs(nx-12.5)<1.25&&ny<5.1&&ny>3.8){enterInterior('gym')}else if(wildMaps.includes(mapMode)&&canStand(nx,ny)&&findRouteWildAt(nx,ny)){const encountered=findRouteWildAt(nx,ny);player.x=nx;player.y=ny;player.walking=true;player.phase+=dt;recordPlayerTrail();startBattle(encountered)}else if(wildMaps.includes(mapMode)&&d==='down'&&beginLedgeJump(nx,ny)){}else if(mapMode==='mart'&&d==='down'&&ny>10.0&&nx>9&&nx<12){exitInterior()}else if(mapMode==='gym'&&d==='down'&&ny>10.7&&nx>10.8&&nx<13.2){exitInterior()}else if(canStand(nx,ny)){player.x=nx;player.y=ny;player.walking=true;player.phase+=dt;recordPlayerTrail();if((mapMode==='center'||mapMode==='gym')&&d==='down'&&player.y>10.7&&player.x>10.8&&player.x<13.2)exitInterior();const tx=Math.floor(player.x),ty=Math.floor(player.y),cell=tx+','+ty;if(cell!==player.lastCell){player.lastCell=cell;}}}else player.phase=0;updatePartnerActor(dt);updateRouteWilds(dt);syncServiceButton();if(now-lastAutosave>1000){saveGame();lastAutosave=now}draw();requestAnimationFrame(frame)}
const dirKeys={ArrowUp:'up',w:'up',ArrowDown:'down',s:'down',ArrowLeft:'left',a:'left',ArrowRight:'right',d:'right'};window.addEventListener('keydown',e=>{if(e.key==='F2'){e.preventDefault();collisionDebug=!collisionDebug;say(collisionDebug?'충돌 표시 켜짐':'충돌 표시 꺼짐');return}const d=dirKeys[e.key]||dirKeys[e.key.toLowerCase()];if(d){e.preventDefault();held[d]=true}});window.addEventListener('keyup',e=>{const d=dirKeys[e.key]||dirKeys[e.key.toLowerCase()];if(d)held[d]=false});window.addEventListener('blur',()=>{Object.keys(held).forEach(k=>held[k]=false);buttonDir=null;padPointerId=null});const touchPad=document.querySelector('.pad');touchPad.addEventListener('contextmenu',e=>e.preventDefault());document.querySelectorAll('[data-dir]').forEach(b=>{const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();padPointerId=e.pointerId;buttonDir=d;b.setPointerCapture?.(e.pointerId)});b.addEventListener('pointermove',e=>{if(padPointerId!==e.pointerId)return;const hit=document.elementFromPoint(e.clientX,e.clientY)?.closest('[data-dir]');buttonDir=hit&&touchPad.contains(hit)?hit.dataset.dir:null});for(const ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,e=>{if(padPointerId===e.pointerId){buttonDir=null;padPointerId=null}})});document.getElementById('attack').onclick=openMoves;document.getElementById('cancelMove').onclick=()=>{document.getElementById('moves').classList.add('hidden');document.getElementById('battlebuttons').classList.remove('hidden')};document.getElementById('throw').onclick=throwBall;document.getElementById('switch').onclick=()=>{document.getElementById('battlebuttons').classList.add('hidden');document.getElementById('choose').classList.remove('hidden');document.getElementById('battlemsg').textContent='내보낼 포켓몬을 골라줘.';showParty()};const fleeBattle=()=>{if(!wild)return;document.getElementById('battlemsg').textContent='무사히 도망쳤다!';setTimeout(endBattle,650)};document.getElementById('run').onclick=fleeBattle;document.getElementById('fleeChoose').onclick=fleeBattle;document.getElementById('how').onclick=()=>{const place=nearTownService();if(place==='nurse')openTownService('center');else if(place==='clerk')openTownService('mart');else if(place==='gym'){startGymBattle()}else say(mapMode==='route'?'아래쪽 길로 가면 팔레트 마을이 나와!':mapMode==='eastRoute'?'풀숲에서 다양한 포켓몬을 만날 수 있어. 서쪽은 태초마을, 동쪽은 회색시티야.':mapMode==='northTown'?'동쪽 끝의 길로 나가면 다양한 야생 포켓몬이 나오는 숲길이 있어.':'센터와 마트는 문으로 걸어가면 들어갈 수 있어. 안쪽 직원 앞에서 대화 버튼을 눌러 봐!')};function closePartyList(){document.getElementById('partyOverlay').classList.remove('show');busy=false}
function renderRoster(){const box=document.getElementById('rosterList');box.innerHTML='';if(!team.length){box.innerHTML='<div class="roster-empty">아직 포켓몬이 없어.</div>';return}team.forEach((p,i)=>{const card=document.createElement('div');card.className='roster-card';const img=document.createElement('img');img.src=sprite(p.id);img.alt=p.name;const info=document.createElement('div');info.className='roster-info';info.textContent=p.name;const small=document.createElement('small');small.textContent='Lv.'+p.level+' · '+speciesTierNames[p.tier]+' · 체력 '+p.hp+'/'+p.max+' · 공격 '+p.attack+(partnerPokemon===p?' · 현재 파트너':'');info.appendChild(small);const button=document.createElement('button');button.className=partnerPokemon===p?'partner-selected':'';button.textContent=partnerPokemon===p?'함께 걷는 중':'파트너 선택';button.disabled=partnerPokemon===p;button.onclick=()=>{partnerPokemon=p;preloadPartner(p.id);saveGame();renderRoster();say(p.name+'이(가) 파트너가 되었어!')};card.append(img,info,button);box.appendChild(card)})}
function openPartyList(){if(busy)return;busy=true;renderRoster();document.getElementById('partyOverlay').classList.add('show')}
document.getElementById('partyOpen').onclick=openPartyList;document.getElementById('partyClose').onclick=closePartyList;document.getElementById('partyOverlay').addEventListener('click',e=>{if(e.target.id==='partyOverlay')closePartyList()});
document.getElementById('serviceClose').onclick=closeTownService;document.getElementById('trainerPartyCancel').onclick=cancelTrainerPartySelection;document.getElementById('trainerPartyConfirm').onclick=beginGymBattle;document.getElementById('trainerPartyOverlay').addEventListener('click',e=>{if(e.target.id==='trainerPartyOverlay')cancelTrainerPartySelection()});document.getElementById('townOverlay').addEventListener('click',e=>{if(e.target.id==='townOverlay')closeTownService()});function openBag(tab='balls'){bagPreviousBusy=busy;bagReturnFocus=wild&&!gymBattleActive?'capture':'general';busy=true;renderBag(tab);document.getElementById('bagOverlay').classList.add('show')}function ballClass(name){return ({'몬스터볼':'ball-poke','슈퍼볼':'ball-great','하이퍼볼':'ball-ultra','힐볼':'ball-heal','퀵볼':'ball-quick','마스터볼':'ball-master'})[name]||'ball-poke'}function ballGraphic(name){return '<span class="ball-skin '+ballClass(name)+'"><span class="ball-decoration"></span><span class="ball-button"></span></span>'}function renderBag(tab='balls'){document.querySelectorAll('.bag-tab').forEach(b=>b.classList.toggle('active',b.dataset.bagTab===tab));const box=document.getElementById('bagContent');box.innerHTML='';if(tab==='badges'){const owned=[['northTown',gymBadge],['grayCity',gymBadges.grayCity],['blueCity',gymBadges.blueCity]].filter(([,has])=>has);if(!owned.length){box.innerHTML='<div class="bag-empty">아직 가진 배지가 없어. 체육관 관장에게 도전해 봐!</div>';return}for(const [key] of owned){const gym=gymConfigs[key],badge=document.createElement('div');badge.className='bag-item';badge.innerHTML='<span>🏅 '+gym.badge+'<small>'+gym.town+' 체육관 관장 '+gym.name+'에게 받았어.</small></span><b>보유</b>';box.appendChild(badge)}return}for(const ball of ballTypes){const count=ballInventory[ball.name]||0,row=document.createElement('button');row.type='button';row.className='bag-item bag-ball-item';row.disabled=count===0||(bagReturnFocus==='capture'&&gymBattleActive);row.innerHTML='<span class="bag-ball-icon" aria-hidden="true">'+ballGraphic(ball.name)+'</span><span>'+ball.name+'<small>'+(ball.name==='퀵볼'?'첫 턴 포획률 5배':ball.name==='힐볼'?'포획 후 HP 회복':ball.name==='마스터볼'?'무조건 포획':('포획률 '+ball.multiplier+'배'))+'</small></span><b>'+count+'개</b>';row.onclick=()=>{if(bagReturnFocus==='capture'&&wild&&!gymBattleActive){document.getElementById('bagOverlay').classList.remove('show');busy=bagPreviousBusy;throwBall(ball.name)}else{selectedBall=ball.name;document.querySelectorAll('.bag-item').forEach(x=>x.classList.remove('selected'));row.classList.add('selected')}};box.appendChild(row)}}document.getElementById('bag').onclick=()=>openBag('balls');document.getElementById('throw').onclick=()=>openBag('balls');document.getElementById('bagClose').onclick=()=>{document.getElementById('bagOverlay').classList.remove('show');busy=bagPreviousBusy};document.querySelectorAll('.bag-tab').forEach(b=>b.onclick=()=>renderBag(b.dataset.bagTab));document.getElementById('bagOverlay').addEventListener('click',e=>{if(e.target.id==='bagOverlay'){document.getElementById('bagOverlay').classList.remove('show');busy=bagPreviousBusy}});restoreGame();if(wildMaps.includes(mapMode))spawnRouteWilds(mapMode);updateTeam();updateCurrency();if(partnerPokemon)preloadPartner(partnerPokemon.id);saveGame();requestAnimationFrame(frame)
})();</script></body></html>
